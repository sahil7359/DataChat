name: Keep warm

# Free-tier keep-warm: ping /ready so Render/Neon don't cold-start on the first
# real request. A free alternative to cron-job.org. Set the KEEP_WARM_URL repo
# variable to your deployed backend's /ready URL once live (GOLIVE.md).
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.KEEP_WARM_URL != ''
    steps:
      - name: Ping readiness
        run: |
          url="${{ vars.KEEP_WARM_URL }}"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url") && break
            echo "attempt $i: curl failed (exit $?), retrying in 10s..."
            sleep 10
          done
          echo "ready -> $code"
          test "$code" = "200"
