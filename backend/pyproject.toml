[project]
name = "datachat-backend"
version = "0.1.0"
description = "Agentic natural-language analytics over open datasets — safe, grounded, verified SQL."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sahil Chakraborty" }]

dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pgvector>=0.3.6,<0.4",
    "sqlglot>=26,<27",
    "httpx>=0.28,<0.29",
    "redis>=5.2,<6",
    "structlog>=24.4,<25",
    "tenacity>=9.0,<10",
    "orjson>=3.10,<4",
    "starlette>=0.47.2",
]

[project.optional-dependencies]
# Heavier runtime deps kept optional so the pure domain/application unit gate
# installs and runs fast without pulling the full agent/LLMOps stack.
agent = [
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=1.2.22,<2",
]
mlops = ["mlflow>=3.1,<4", "pyarrow>=23.0.1"]

[dependency-groups]
dev = [
    "ruff>=0.8,<0.9",
    "mypy>=1.14,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6.0,<8",
    "anyio>=4.7,<5",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
    "filelock>=3.16,<4",
    "import-linter>=2.1,<3",
    "types-redis>=4.6,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "ingestion", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes/pycodestyle
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # flake8-bandit (security)
    "ASYNC",         # async correctness
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",
]
ignore = [
    "S101",  # asserts are fine in tests; see per-file override below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingestion"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
mypy_path = "."
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "langgraph.*", "langchain_core.*", "mlflow.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests, no external services",
    "integration: needs a live Postgres/Redis (Docker/CI)",
    "eval: agent golden-set evaluation (needs LLM stack)",
    "security: OWASP LLM/Agentic security cases",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/interface/*", "tests/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "\\.\\.\\.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "class .*\\(Protocol\\):",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Domain never imports outward"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.interface",
    "app.config",
    "app.container",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "langgraph",
    "langchain_core",
    "mlflow",
    "redis",
    "httpx",
    "sqlglot",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
containers = ["app"]
layers = ["interface", "application", "domain"]
exhaustive = false
