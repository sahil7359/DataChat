# Local topology mirrors production (NFR-8): postgres+pgvector, redis, backend,
# frontend, mlflow. Everything runs against .env with USE_MOCKS=true so no real
# keys are needed. Real hosts (Neon/Upstash/Vercel/Render) are documented in
# GOLIVE.md; here we self-host the equivalents.

name: datachat

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datachat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datachat}
      POSTGRES_DB: ${POSTGRES_DB:-datachat}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datachat}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      # DB/Redis/MLflow must point at the service hostnames, so they're pinned.
      # USE_MOCKS + Ollama come from .env (interpolated) and default to the
      # keyless mock path; set them in .env to run your local Ollama instead.
      DATACHAT_USE_MOCKS: "${DATACHAT_USE_MOCKS:-true}"
      DATACHAT_OLLAMA_ENABLED: "${DATACHAT_OLLAMA_ENABLED:-false}"
      DATACHAT_OLLAMA_BASE_URL: "${DATACHAT_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      DATACHAT_OLLAMA_API_KEY: "${DATACHAT_OLLAMA_API_KEY:-}"
      DATACHAT_OLLAMA_MODEL: "${DATACHAT_OLLAMA_MODEL:-llama3.2}"
      # Web-search fallback for out-of-scope questions (off by default; results are
      # untrusted and never touch the SQL path). provider: mock | ddgs
      DATACHAT_WEB_SEARCH_ENABLED: "${DATACHAT_WEB_SEARCH_ENABLED:-false}"
      DATACHAT_WEB_SEARCH_PROVIDER: "${DATACHAT_WEB_SEARCH_PROVIDER:-mock}"
      DATACHAT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-datachat}:${POSTGRES_PASSWORD:-datachat}@postgres:5432/${POSTGRES_DB:-datachat}
      DATACHAT_EXECUTOR_DATABASE_URL: postgresql+asyncpg://datachat_exec:datachat_exec@postgres:5432/${POSTGRES_DB:-datachat}
      DATACHAT_EXECUTOR_ROLE_PASSWORD: datachat_exec
      DATACHAT_REDIS_URL: redis://redis:6379/0
      DATACHAT_MLFLOW_TRACKING_URI: http://mlflow:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - "alembic upgrade head && python -m ingestion.run --dataset seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    # Self-contained SQLite store: no extra DB driver needed in the mlflow image,
    # and it survives restarts via the volume. (Prod uses Neon — see GOLIVE.md.)
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  pgdata:
  mlflow-data:
